name: PLBD CI

on:
  push:
    branches: [main, audit-fixes, audit/diagnostics]
  pull_request:
    branches: [main, redesign/vscode-workbench]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend type-check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check all dependencies for high-severity advisories
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile-check backend modules
        run: python -m compileall -q backend
      - name: Run logic analyzer tests
        working-directory: backend
        run: python test_logic.py

  docker-image:
    name: Build isolated C runner image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build PLBD C runner image
        run: docker build -t plbd-c-runner:1.0 .
